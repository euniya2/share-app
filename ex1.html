<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청량한 여름! 랜덤 발표자 뽑기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');

        :root {
            --summer-blue: #00b4d8;
            --ocean-deep: #0077b6;
            --sea-foam: #caf0f8;
            --sand: #fefae0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #caf0f8 0%, #90e0ef 50%, #00b4d8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .shuffle-animation {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .winner-card {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--summer-blue);
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <!-- 배경 거품 효과 -->
    <div id="bubble-container"></div>

    <div class="glass-panel w-full max-w-4xl p-6 md:p-10 z-10">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-[#0077b6] flex items-center justify-center gap-3">
                <i class="fas fa-umbrella-beach text-orange-400"></i>
                발표자 뽑기
            </h1>
            <p class="text-blue-700 mt-2 font-medium">시원한 여름 수업, 공정한 기회!</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 왼쪽: 명단 관리 -->
            <div class="flex flex-col gap-4">
                <div class="bg-white/50 p-4 rounded-2xl border border-white/50">
                    <label class="block text-sm font-bold text-blue-800 mb-2">학생 명단 입력</label>
                    <div class="flex gap-2">
                        <input type="text" id="nameInput" placeholder="이름을 입력하세요" 
                               class="flex-1 px-4 py-2 rounded-xl border-2 border-blue-200 focus:border-blue-400 focus:outline-none bg-white/80">
                        <button onclick="addName()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-xl transition-all shadow-md">
                            추가
                        </button>
                    </div>
                    <p class="text-xs text-blue-600 mt-2">* 쉼표(,)나 줄바꿈으로 한꺼번에 추가할 수 있습니다.</p>
                </div>

                <div class="bg-white/50 p-4 rounded-2xl border border-white/50 flex-1 flex flex-col min-h-[300px]">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-bold text-blue-800">참여 학생 (<span id="count">0</span>명)</span>
                        <button onclick="clearList()" class="text-xs text-red-500 hover:underline">전체 삭제</button>
                    </div>
                    <div id="nameList" class="flex flex-wrap gap-2 overflow-y-auto max-h-[250px] content-start">
                        <!-- 이름 태그들이 여기에 생성됨 -->
                    </div>
                </div>
            </div>

            <!-- 오른쪽: 뽑기 화면 -->
            <div class="flex flex-col items-center justify-center bg-blue-500/10 rounded-3xl p-6 border-2 border-dashed border-blue-300">
                <div id="displayArea" class="text-center mb-8">
                    <div id="statusText" class="text-blue-600 font-bold mb-4 h-6">준비되었습니다!</div>
                    <div id="pickerDisplay" class="text-6xl md:text-8xl font-black text-blue-900 drop-shadow-lg h-32 flex items-center justify-center">
                        ?
                    </div>
                </div>

                <div class="flex flex-col gap-3 w-full max-w-xs">
                    <div class="flex items-center justify-center gap-2 mb-4 text-sm text-blue-800">
                        <input type="checkbox" id="excludePicked" class="w-4 h-4 accent-blue-600" checked>
                        <label for="excludePicked">한 번 뽑힌 학생 제외하기</label>
                    </div>
                    
                    <button onclick="pickWinner()" id="pickBtn" 
                            class="bg-[#0077b6] hover:bg-[#03045e] text-white text-xl font-bold py-4 px-8 rounded-2xl shadow-xl transform active:scale-95 transition-all">
                        랜덤 뽑기 시작!
                    </button>
                    
                    <button onclick="resetPicked()" class="text-blue-600 hover:text-blue-800 text-sm font-medium py-2">
                        제외된 목록 초기화
                    </button>
                </div>
            </div>
        </div>

        <!-- 하단: 뽑힌 명단 (히스토리) -->
        <div class="mt-8 border-t border-blue-200 pt-6">
            <h3 class="text-blue-800 font-bold mb-3 flex items-center gap-2">
                <i class="fas fa-history"></i> 뽑힌 순서
            </h3>
            <div id="historyList" class="flex flex-wrap gap-2">
                <span class="text-gray-400 text-sm italic">아직 뽑힌 학생이 없습니다.</span>
            </div>
        </div>
    </div>

    <!-- 결과 알림 모달 (선택 사항) -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="glass-panel p-10 text-center winner-card max-w-sm w-full bg-white">
            <div class="text-2xl text-blue-600 mb-2">오늘의 발표자!</div>
            <div id="modalWinner" class="text-6xl font-black text-blue-900 mb-6"></div>
            <button onclick="closeModal()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">확인</button>
        </div>
    </div>

    <script>
        let students = [];
        let pickedStudents = [];
        let isSpinning = false;

        // 배경 거품 생성
        function createBubbles() {
            const container = document.getElementById('bubble-container');
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 60 + 20 + 'px';
                bubble.style.width = size;
                bubble.style.height = size;
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDuration = Math.random() * 5 + 5 + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(bubble);
            }
        }

        function addName() {
            const input = document.getElementById('nameInput');
            const rawValue = input.value.trim();
            if (!rawValue) return;

            // 쉼표, 공백, 줄바꿈으로 구분하여 배열 생성
            const names = rawValue.split(/[\s,\n]+/).filter(n => n.length > 0);
            
            names.forEach(name => {
                if (!students.includes(name)) {
                    students.push(name);
                }
            });

            input.value = '';
            renderList();
        }

        // 엔터키 지원
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addName();
        });

        function removeName(name) {
            students = students.filter(s => s !== name);
            pickedStudents = pickedStudents.filter(s => s !== name);
            renderList();
            renderHistory();
        }

        function clearList() {
            if (confirm('전체 명단을 삭제하시겠습니까?')) {
                students = [];
                pickedStudents = [];
                renderList();
                renderHistory();
            }
        }

        function renderList() {
            const listEl = document.getElementById('nameList');
            const countEl = document.getElementById('count');
            listEl.innerHTML = '';
            countEl.innerText = students.length;

            students.forEach(name => {
                const isPicked = pickedStudents.includes(name);
                const tag = document.createElement('div');
                tag.className = `flex items-center gap-2 px-3 py-1 rounded-full text-sm font-medium transition-all ${
                    isPicked ? 'bg-gray-300 text-gray-500 opacity-60' : 'bg-white text-blue-700 border border-blue-200 shadow-sm'
                }`;
                tag.innerHTML = `
                    ${name}
                    <button onclick="removeName('${name}')" class="hover:text-red-500"><i class="fas fa-times"></i></button>
                `;
                listEl.appendChild(tag);
            });
        }

        function pickWinner() {
            if (isSpinning) return;
            
            const exclude = document.getElementById('excludePicked').checked;
            let available = exclude 
                ? students.filter(s => !pickedStudents.includes(s))
                : students;

            if (available.length === 0) {
                if (students.length === 0) {
                    alert('학생 명단을 먼저 입력해주세요!');
                } else {
                    alert('모든 학생이 한 번씩 발표했습니다. 목록을 초기화합니다.');
                    resetPicked();
                }
                return;
            }

            startSpin(available);
        }

        function startSpin(pool) {
            isSpinning = true;
            const display = document.getElementById('pickerDisplay');
            const status = document.getElementById('statusText');
            const btn = document.getElementById('pickBtn');
            
            btn.disabled = true;
            status.innerText = '두구두구두구...';
            display.classList.add('shuffle-animation');

            let counter = 0;
            const duration = 20; // 셔플 횟수
            const interval = setInterval(() => {
                const tempName = pool[Math.floor(Math.random() * pool.length)];
                display.innerText = tempName;
                counter++;

                if (counter > duration) {
                    clearInterval(interval);
                    finishSpin(pool);
                }
            }, 100);
        }

        function finishSpin(pool) {
            const display = document.getElementById('pickerDisplay');
            const status = document.getElementById('statusText');
            const btn = document.getElementById('pickBtn');
            
            const winner = pool[Math.floor(Math.random() * pool.length)];
            
            display.classList.remove('shuffle-animation');
            display.innerText = winner;
            status.innerText = '당첨!';
            
            if (!pickedStudents.includes(winner)) {
                pickedStudents.push(winner);
            }
            
            // 모달 표시
            setTimeout(() => {
                showModal(winner);
                isSpinning = false;
                btn.disabled = false;
                renderList();
                renderHistory();
            }, 500);
        }

        function showModal(winner) {
            const modal = document.getElementById('modal');
            const modalWinner = document.getElementById('modalWinner');
            modalWinner.innerText = winner;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (pickedStudents.length === 0) {
                container.innerHTML = '<span class="text-gray-400 text-sm italic">아직 뽑힌 학생이 없습니다.</span>';
                return;
            }

            container.innerHTML = '';
            pickedStudents.forEach((name, index) => {
                const tag = document.createElement('span');
                tag.className = 'px-3 py-1 bg-blue-100 text-blue-800 rounded-lg text-xs font-bold border border-blue-200';
                tag.innerText = `${index + 1}. ${name}`;
                container.appendChild(tag);
            });
        }

        function resetPicked() {
            pickedStudents = [];
            document.getElementById('pickerDisplay').innerText = '?';
            document.getElementById('statusText').innerText = '준비되었습니다!';
            renderList();
            renderHistory();
        }

        // 초기화
        window.onload = () => {
            createBubbles();
            // 예시 데이터 (테스트용 - 필요 없으시면 지우셔도 됩니다)
            const exampleNames = ["김여름", "이파도", "박모래", "최햇살", "강바람"];
            students = exampleNames;
            renderList();
        };
    </script>
</body>
</html>
